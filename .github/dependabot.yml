# Weekly update pull requests. They go through the same CI and review as any
# other change; nothing is merged automatically.
#
# Actions are pinned by SHA with a `# vX.Y.Z` comment. Dependabot updates both,
# and `every_sha_pin_names_its_release` (crates/tea-cli/tests/workflow_policy.rs)
# fails if a comment goes missing. `dtolnay/rust-toolchain` has no release tags,
# so expect no updates for it; bump it by hand (docs/release-pins.md).
#
# Cargo updates respect the MSRV only as far as the lock file goes: the
# `rust 1.89.0` job fails if an update needs a newer Rust.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The RustCrypto crates share the `digest` traits and only compile when
      # they move together, so every bump of them (major included) is one PR.
      rustcrypto:
        patterns: [digest, sha1, sha2, sha3, blake2, blake3]
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      fuzz-rustcrypto:
        patterns: [digest, sha1, sha2, sha3, blake2, blake3]
      fuzz-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
