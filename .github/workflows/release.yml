# Release binaries: build, checksum, SBOM, provenance, DRAFT GitHub release.
#
# Triggered only by pushing a tag that points at a commit on main. It never
# publishes to crates.io, never publishes the GitHub release (the result is a
# draft), and holds no repository secret. Third-party actions are pinned by commit
# SHA and the cargo-cyclonedx version is exact (`docs/release-pins.md`). Not run
# on GitHub yet.
#
# Jobs and their authority:
#   meta           contents: read     validates the tag, no build
#   build (x7)     contents: read     builds and packages; no token, no secret
#   sbom           contents: read     CycloneDX SBOM of the CLI's dependency tree
#   attest         contents: read, id-token: write, attestations: write
#                                     checksums + build-provenance attestation;
#                                     runs no repository code
#   draft-release  contents: write    creates the draft; has no source checkout

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fail closed: no tag produces a release while a PIN_ME_* placeholder
      # remains (docs/release-pins.md). The flag that development uses to
      # tolerate them is never read in this mode.
      - name: Refuse unresolved pins
        run: ./scripts/check-pins.sh --release
      - name: Check the tag against the crate version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-tag.sh "$TAG" >> "$GITHUB_OUTPUT"
      # Every tag, dry runs included, must point at a commit on main. The
      # workflow that runs is the one in the tagged commit, so this keeps a
      # branch-only edit of release.yml from ever holding the write and
      # attestation permissions below.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # Runner images are named, never `-latest`: the gnu binaries link the glibc of
  # the image they are built on, and ubuntu-latest is moving to a newer Ubuntu.
  # ubuntu-24.04 is the deliberate baseline (docs/installing.md). Changing an
  # image is a change to what the release supports, so it goes through review.
  build:
    name: build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe: ""
            musl: false
            smoke: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            exe: ""
            musl: true
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            exe: ""
            musl: false
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            exe: ""
            musl: true
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-15
            exe: ""
            musl: false
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-15
            exe: ""
            musl: false
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            exe: ".exe"
            musl: false
            smoke: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 2026-10-16
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build libtea
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *-musl ]]; then
            underscored="${TARGET//-/_}"
            export "CC_${underscored}=musl-gcc"
            export "CARGO_TARGET_${underscored^^}_LINKER=musl-gcc"
          fi
          cargo build --release --locked -p libtea-cli --target "$TARGET"
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/libtea$EXE"
          "$bin" spec --json | grep -q '962a0228af1bfcc1232ac3f79239317ff33fdb04'
          "$bin" --help > /dev/null
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" scripts/package-release.py --target "$TARGET" --version "$VERSION" \
            --binary "target/$TARGET/release/libtea$EXE" --out dist
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Replace with an exact released version (docs/release-pins.md).
      CARGO_CYCLONEDX_VERSION: 0.5.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 2026-10-16
        with:
          toolchain: "1.89.0"
      - name: Install cargo-cyclonedx at a pinned version
        run: |
          set -euo pipefail
          [[ "$CARGO_CYCLONEDX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "CARGO_CYCLONEDX_VERSION is not pinned; see docs/release-pins.md" >&2
            exit 1
          }
          cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
      - name: Generate the SBOM
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: ./scripts/make-sbom.sh "dist/libtea-${VERSION}.cdx.json"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: checksums and provenance
    needs: [meta, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Mandatory: the Environment's required reviewers are the last gate before
    # anything is signed (docs/release-checklist.md, repository settings).
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Exactly these files, named for exactly this tag, and nothing else. A
      # count would let a misnamed or extra artifact through.
      - name: Check the file names
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(
            for target in aarch64-apple-darwin aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
              x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
              case "$target" in
                (*windows*) printf 'libtea-%s-%s.zip\n' "$VERSION" "$target" ;;
                (*) printf 'libtea-%s-%s.tar.gz\n' "$VERSION" "$target" ;;
              esac
            done
            printf 'libtea-%s.cdx.json\n' "$VERSION"
          )
          actual=$(cd dist && printf '%s\n' ./* | sed 's|^\./||')
          if [[ "$(printf '%s\n' "$expected" | LC_ALL=C sort)" != "$(printf '%s\n' "$actual" | LC_ALL=C sort)" ]]; then
            echo "dist/ does not hold exactly the expected files" >&2
            echo "--- expected" >&2; printf '%s\n' "$expected" >&2
            echo "--- found" >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
      - name: SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          printf '%s\n' ./* | sed 's|^\./||' | LC_ALL=C sort > ../files.txt
          xargs sha256sum < ../files.txt > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: draft GitHub release
    needs: [meta, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Mandatory, like the attest job. The release is created as a DRAFT only;
    # publishing it is a manual step (docs/release-checklist.md).
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Re-check the checksums
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ needs.meta.outputs.dry_run }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --generate-notes --title "libtea $TAG")
          if [[ "$DRY_RUN" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
