name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust: ["stable", "1.89.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no release tags)
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked
      # `--all-targets` does not run doctests; the `#[non_exhaustive]`
      # compile_fail guards live there.
      - name: Doctests
        run: cargo test --workspace --doc --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # The code is portable and the release ships Windows and macOS binaries, so the
  # tests run there too. Tests that need a Unix shell or Unix file permissions
  # are `#[cfg(unix)]` and are skipped on Windows. Stable only: the MSRV and the
  # lints are checked on Linux.
  test-os:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no release tags)
        with:
          toolchain: stable
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
      - name: Doctests
        run: cargo test --workspace --doc --all-features --locked

  # Mutation check: strips every #[non_exhaustive] in a scratch copy and requires
  # every compile_fail guard to fail there, so a guard cannot pass for another
  # reason. See crates/*/src/non_exhaustive_guards.rs.
  guards:
    name: non_exhaustive guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no release tags)
        with:
          toolchain: stable
      - name: Mutation check for compile_fail guards
        run: ./scripts/check-non-exhaustive-guards.sh

  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no release tags)
        with:
          toolchain: "1.89.0"
      # Packaging only here. `cargo publish --dry-run` is a maintainer handoff
      # step (see docs/release-checklist.md), not a CI merge gate.
      - name: Verify libtea-core package
        run: cargo package -p libtea-core --locked
      # Until libtea-core 0.1.0 is on crates.io, full client verify against the
      # registry dependency cannot succeed. List packaged files only.
      - name: List libtea-client files
        run: cargo package -p libtea-client --locked --no-verify --list
      - name: Confirm CLI and conformance stay unpublished
        run: |
          grep -q 'publish = false' crates/tea-cli/Cargo.toml
          grep -q 'publish = false' crates/tea-conformance/Cargo.toml

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

  # Skips cleanly only while a crate has never been published (crates.io 404).
  # Any other lookup failure fails the job, so a network or API error cannot
  # silently turn the check off. Once a version is on crates.io the check runs
  # against the latest published version and fails on breaking changes.
  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no release tags)
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks
      - name: Check publishable crates against crates.io
        run: |
          set -euo pipefail
          for crate in libtea-core libtea-client; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'libtea-rs-ci (https://github.com/Mehrn0ush/libtea-rs)' \
              "https://crates.io/api/v1/crates/${crate}")"
            case "$status" in
              200)
                cargo semver-checks check-release -p "$crate"
                ;;
              404)
                echo "${crate} is not on crates.io yet; no baseline, skipping (first release only)."
                ;;
              *)
                echo "::error::crates.io lookup for ${crate} returned HTTP ${status}; refusing to skip semver-checks."
                exit 1
                ;;
            esac
          done
