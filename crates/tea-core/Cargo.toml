[package]
name = "libtea-core"
version = "0.1.6"
description = "Independent Rust types and protocol rules for the CycloneDX Transparency Exchange API. No network I/O."
readme = "README.md"
keywords = ["cyclonedx", "sbom", "tei", "transparency", "bom"]
categories = ["api-bindings", "parsing"]
edition.workspace = true
license.workspace = true
