[workspace]
resolver = "3"
members = [
    "crates/tea-core",
    "crates/tea-client",
    "crates/tea-conformance",
    "crates/tea-cli",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/Mehrn0ush/libtea-rs"

[workspace.dependencies]
libtea-core = { version = "0.1.5", path = "crates/tea-core" }
libtea-client = { version = "0.1.5", path = "crates/tea-client" }
libtea-conformance = { version = "0.1.5", path = "crates/tea-conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Plain caret ranges: no caps and no exact pins. The MSRV (1.89) is the
# highest rust-version among the resolved dependencies (uuid 1.29).
url = "2"
uuid = { version = "1", features = ["serde"] }
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
digest = "0.10"
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
futures-util = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
wiremock = "0.6"
